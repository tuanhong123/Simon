<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company Analysis: Forecasting</title>
<link rel="stylesheet" href="../lib/engine.css">
<link rel="expect" href="#bar" blocking="render">
</head>
<body>
<script src="../lib/engine.js"></script>
<script src="../lib/common.js"></script>
<script src="audio/en/timings.js"></script>
<script>
'use strict';
const CHAPTER = { number: 11, title: 'Company Analysis: Forecasting', minutes: 8, language: 'en', next: '../ch12/' };

const cardRow = (p, m, items, { x0 = 100, step = 300, w = 270, y = 250, h = 380, hs = 30, bs = 24, n = 20 } = {}) => items.forEach(([head, body, c, mk_], i) =>
  infoCard(p, x0 + i * step, y, w, h, c, head, body, m(mk_), { hs, bs, n }));
const MARGIN = Array.from({ length: 6 }, (_, t) => 15 + 13 * .8 ** t);

const BEATS = [
  introBeat('Equity Investments, Chapter 11', 'Company Analysis:', 'Forecasting', 'what to forecast, and how'),

  ['objects', 'What to forecast', (m) => {
    const p = panel(0);
    cardRow(p, m, [['Drivers', [['stores open, sales per store'], ['explain growth; often more accurate', COL.dim]], COL.good, 'drv'], ['Individual lines', [['items without clear drivers'], ['or of small importance', COL.dim]], COL.whole, 'line'],
      ['Summary measures', [['free cash flow, EPS'], ['efficient, less transparent', COL.dim]], COL.task, 'sum'], ['Ad hoc objects', [['legal settlement, disaster'], ['not yet in the statements', COL.dim]], COL.real, 'adhoc']], { x0: 90, step: 370, w: 340, y: 170, h: 330, hs: 30, bs: 27, n: 24 });
    show(pill(p, 'Prefer objects that companies disclose regularly', COL.good, 800, 650, 0, 30), m('note'));
  }],

  ['approaches', 'Four forecast approaches', (m) => {
    const p = panel(0);
    cardRow(p, m, [['Historical results', [['assume the past repeats'], ['good: stable conditions', COL.good], ['weak: cyclical companies', COL.bad]], COL.whole, 'hist'],
      ['Base rates and convergence', [['drift toward a peer or industry norm'], ['good: unusually high or low results', COL.good], ['weak: unique business models', COL.bad]], COL.nat, 'base'],
      ['Management guidance', [['company-specific items'], ['good: things management controls', COL.good], ['weak: macro variables; optimism', COL.bad]], COL.task, 'mgmt'],
      ['Analyst discretion', [['your own view of the drivers'], ['good: changing conditions, cyclicals', COL.good], ['weak: needs evidence and skill', COL.bad]], COL.real, 'disc']], { x0: 90, step: 370, w: 340, y: 150, h: 500, hs: 32, bs: 26, n: 24 });
    text(p, 'In practice, analysts combine approaches', 800, 780, m('note'), { size: 32, fill: COL.good, anchor: 'middle', weight: 700 });
  }],

  ['convergence', 'Convergence to a norm', (m) => {
    const p = panel(0), X = t => 300 + t * 200, Y = v => 750 - (v - 12) * 30;
    axisLine(p, 220, 1400, 790); path(p, 'M220 790V150', { stroke: COL.chalk, 'stroke-width': 3 });
    [0, 1, 2, 3, 4, 5].forEach(t => text(p, 'Year ' + t, X(t), 835, .3, { size: 24, fill: COL.dim, anchor: 'middle' }));
    text(p, 'Operating margin, %', 210, 130, .3, { size: 26, fill: COL.dim, weight: 600 });
    draw(path(p, `M220 ${Y(15)}H1400`, { stroke: COL.dim, 'stroke-width': 4, 'stroke-dasharray': '10 8' }, { d: 0 }), m('start'), .8);
    text(p, 'industry margin 15%', 1400, Y(15) + 40, m('start', .5), { size: 26, fill: COL.dim, anchor: 'end' });
    text(p, 'Company margin 28%', X(0) + 70, Y(28) - 26, m('start', 1), { size: 28, fill: COL.task, weight: 700 });
    draw(path(p, MARGIN.map((v, t) => (t ? 'L' : 'M') + X(t) + ' ' + Y(v)).join(''), { stroke: COL.task, 'stroke-width': 7 }, { d: 0 }), m('curve'), 3);
    MARGIN.forEach((v, t) => text(p, v.toFixed(1), X(t), Y(v) - 22, m('curve', .4 + t * .55), { size: 28, fill: COL.task, anchor: 'middle', weight: 700 }));
    text(p, 'gap closes 20% a year: competitors chase high returns', 800, 890, m('note'), { size: 28, fill: COL.good, anchor: 'middle', weight: 700 });
  }],

  ['revenue', 'Top-down and bottom-up revenue', (m) => {
    const p = panel(0);
    const col = (x, head, c, rows, t0) => { show(box(p, x, 170, 600, 380, c, t0, .1), 0); text(p, head, x + 300, 235, t0, { size: 38, fill: c, anchor: 'middle', weight: 700 });
      rows.forEach(([s, size], i) => text(p, s, x + 300, 330 + i * 70, t0 + .5 + i * .6, { size: size || 30, anchor: 'middle', weight: i === rows.length - 1 ? 700 : 500, fill: i === rows.length - 1 ? c : COL.chalk })); };
    col(130, 'Top-down', COL.whole, [['market 10,000 × 1.04 = 10,400'], ['× share 12%'], ['revenue 1,248', 40]], m('td'));
    col(870, 'Bottom-up', COL.good, [['120 stores'], ['× 10.4 sales per store'], ['revenue 1,248', 40]], m('bu'));
    text(p, '=', 800, 380, m('bu', 2), { size: 80, fill: COL.task, anchor: 'middle', weight: 700 });
    text(p, 'If they disagree, one holds a hidden assumption', 800, 650, m('gap'), { size: 34, fill: COL.bad, anchor: 'middle', weight: 700 });
    text(p, 'Keep non-recurring revenue (e.g. currency effects) separate', 800, 740, m('note'), { size: 28, fill: COL.dim, anchor: 'middle' });
  }],

  ['workingcap', 'Operating costs and working capital', (m) => {
    const p = panel(0), base = 740, k = .6;
    text(p, 'Revenue 3,650   Cost of sales 2,190 (60%)', 130, 140, m('opex'), { size: 30, fill: COL.dim, weight: 600 });
    text(p, 'Costs coherent with revenue: % of sales, fixed costs separately', 130, 185, m('opex', .6), { size: 25, fill: COL.dim });
    [['Receivables = DSO × revenue ÷ 365', '30 × 3,650 ÷ 365 = 300', COL.task, 'ar', 300], ['Inventory = DOH × cost of sales ÷ 365', '60 × 2,190 ÷ 365 = 360', COL.whole, 'inv', 400], ['Payables = DPO × cost of sales ÷ 365', '45 × 2,190 ÷ 365 = 270', COL.bad, 'ap', 500]].forEach(([a, b, c, k_, y]) => {
      text(p, a, 130, y - 30, m(k_), { size: 26, fill: COL.dim }); text(p, b, 130, y + 10, m(k_, .4), { size: 34, fill: c, weight: 700 }); });
    text(p, 'Net working capital = 300 + 360 − 270 = 390', 130, 650, m('nwc'), { size: 34, fill: COL.good, weight: 700 });
    text(p, 'growing sales grow working capital, and absorb cash', 130, 705, m('nwc', 1.2), { size: 26, fill: COL.dim });
    axisLine(p, 1000, 1500, base);
    bar(p, 1090, base, k, [[300, COL.task]], m('ar'), { w: 100, top: '300', label: 'Receiv.' }); bar(p, 1250, base, k, [[360, COL.whole]], m('inv'), { w: 100, top: '360', label: 'Inventory' }); bar(p, 1410, base, k, [[270, COL.bad]], m('ap'), { w: 100, top: '−270', label: 'Payables' });
  }],

  ['capex', 'Capital spending and funding', (m) => {
    const p = panel(0), base = 740, k = 2.4;
    axisLine(p, 140, 1300, base);
    stackBar(p, 330, base, k, [[100, COL.task, 'maintenance'], [80, COL.good, 'growth']], m('maint'), 'Capital spending 180', true);
    draw(path(p, `M230 ${base - 100 * k}H620`, { stroke: COL.task, 'stroke-width': 3, 'stroke-dasharray': '8 8' }, { d: 0 }), m('maint', .6), .6);
    text(p, '≈ depreciation and amortization 100', 636, base - 100 * k + 8, m('maint', .9), { size: 24, fill: COL.task });
    stackBar(p, 920, base, k, [[150, COL.whole, 'operating cash flow'], [30, COL.bad, 'new borrowing']], m('fund'), 'Funding 180');
    text(p, 'Capital structure: start from historical leverage and financial strategy, then adjust for funding', 800, 860, m('note'), { size: 26, fill: COL.good, anchor: 'middle', weight: 600 });
  }],

  ['scenarios', 'Scenario analysis', (m) => {
    const p = panel(0), base = 720, k = 140;
    axisLine(p, 200, 1400, base);
    [[400, 2.0, COL.whole, 'Base case', '50%', 'base'], [800, 2.6, COL.good, 'Upside', '25%', 'bull'], [1200, 1.2, COL.bad, 'Downside', '25%', 'bear']].forEach(([x, v, c, n, pr, k_]) => {
      bar(p, x, base, k, [[v, c]], m(k_), { w: 170, label: n, top: '$' + v.toFixed(2) }); text(p, 'probability ' + pr, x, base + 82, m(k_, .5), { size: 26, fill: COL.dim, anchor: 'middle' }); });
    draw(path(p, `M200 ${base - 1.95 * k}H1400`, { stroke: COL.task, 'stroke-width': 4, 'stroke-dasharray': '12 8' }, { d: 0 }), m('ev'), .8);
    text(p, 'probability-weighted EPS $1.95', 1400, base - 1.95 * k - 16, m('ev', .5), { size: 28, fill: COL.task, anchor: 'end', weight: 700 });
    text(p, '0.5 × 2.00 + 0.25 × 2.60 + 0.25 × 1.20 = 1.95', 800, 140, m('ev', .8), { size: 30, anchor: 'middle', weight: 600 });
    text(p, 'The spread shows how much confidence the forecast deserves', 800, 860, m('note'), { size: 30, fill: COL.good, anchor: 'middle', weight: 700 });
  }],

  ['wrap', 'Summary', (m) => { wrapList(panel(0), m, [
    ['Forecast objects that are regularly disclosed, preferably drivers.', 'w1'],
    ['Choose among history, base rates, guidance and discretion; combine them.', 'w2'],
    ['Cross-check top-down and bottom-up revenue; derive costs, working capital and capex from it.', 'w3'],
    ['Use probability-weighted scenarios to show the range of outcomes.', 'w4']], 29); }],

  FINISH,
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

function stackBar(p, cx, base, k, segs, t0, label, left) {
  const g = G(p, { y: 30, o: 0 }); let y = base;
  segs.forEach(([v, c, name]) => { const h = v * k; y -= h; mk('rect', { x: cx - 100, y: y + 1, width: 200, height: h - 2, rx: 4, fill: c, 'fill-opacity': .88 }, g);
    T(g, `${name} ${v}`, { x: left ? cx - 116 : cx + 116, y: y + h / 2 + 8, size: 26, fill: c, anchor: left ? 'end' : 'start', weight: 600 }); });
  T(g, label, { x: cx, y: base + 42, size: 26, fill: COL.dim, anchor: 'middle' });
  tw(g, { o: 1, y: 0 }, t0, .6, out);
}

boot();
</script>
</body>
</html>
