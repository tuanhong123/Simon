<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixed-Income Markets for Corporate Issuers</title>
<link rel="stylesheet" href="../lib/engine.css">
<link rel="expect" href="#bar" blocking="render"><!-- hold the first frame until the player exists, so the page transition can run -->
</head>
<body>
<script src="../lib/engine.js"></script>
<script src="../lib/helpers.js"></script>
<script src="audio/en/timings.js"></script>
<script>
'use strict';
const CHAPTER = { number: 4, title: 'Fixed-Income Markets for Corporate Issuers', minutes: 9, language: 'en', next: '../ch05/' };

const party = (p, x, y, w, h, color, title, sub) => { const g = card1(p, x, y, w, h, color); T(g, title, { y: sub ? -8 : 12, size: 36, fill: color, weight: 600, anchor: 'middle' }); if (sub) T(g, sub, { y: 34, size: 24, fill: COL.dim, anchor: 'middle' }); return g; };
const lab = (p, s, x, y, t, c = COL.chalk, size = 26) => text(p, s, x, y, t, { size, fill: c, anchor: 'middle', weight: 600 });

const BEATS = [
  ['intro', 'Corporate funding markets', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Fixed Income, Module 4', { x: 800, y: 290, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Fixed-Income Markets', { x: 800, y: 390, size: 76, weight: 600, anchor: 'middle' });
    T(g, 'for Corporate Issuers', { x: 800, y: 480, size: 76, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = text(scene, 'short-term funding, commercial paper and repos', 800, 610, m('sub'), { size: 34, fill: COL.dim, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],

  ['lines', 'Bank lines of credit', (m) => {
    const p = panel(0), x0 = 520;
    text(p, 'Short-term bank borrowing', 800, 120, .3, { size: 40, fill: COL.chalk, anchor: 'middle', weight: 600 });
    [['Uncommitted line', 220, COL.bad, 'unc', ['no fee, only interest on use', 'the bank can refuse to lend']], ['Committed line', 440, COL.task, 'reg', ['written promise, up to 364 days', 'commitment fee (e.g. 0.50%) · bank syndicate']], ['Revolving credit', 700, COL.good, 'rev', ['multiyear commitment', 'covenants, like a bond indenture']]].forEach(([n, w, c, k, ls], i) => {
      const y = 250 + i * 190, g = G(p, { o: 0 });
      T(g, n, { x: x0 - 24, y: y + 12, size: 34, fill: c, weight: 600, anchor: 'end' });
      const r = mk('rect', { x: x0, y: y - 32, width: 0, height: 64, rx: 8, fill: c, 'fill-opacity': .88 }, g);
      ls.forEach((s, j) => T(g, s, { x: x0, y: y + 70 + j * 34, size: 26, fill: j ? COL.dim : COL.chalk, weight: j ? 500 : 600 }));
      show(g, m(k)); tw(r, { a_width: w }, m(k, .3), .9);
    });
    text(p, 'reliability  →', 1500, 850, m('rev', 1), { size: 28, fill: COL.dim, anchor: 'end' });
  }],

  ['secured', 'Collateral-based funding', (m) => {
    const p = panel(0);
    show(infoCard(p, 290, 380, 440, 320, COL.rat, 'Secured loan', ['backed by assets such as', 'equipment or inventory', 'the lender files a lien'], 40), m('sec'));
    show(infoCard(p, 800, 380, 440, 320, COL.task, 'Assignment', ['receivables are the collateral', 'the company still collects', 'the payments'], 40), m('assign'));
    show(infoCard(p, 1310, 380, 440, 320, COL.good, 'Factoring', ['receivables sold at a', 'discount to a factor', 'which collects the payments'], 40), m('factor'));
    text(p, 'weaker credit quality  →  collateral required', 800, 700, m('sec', 4), { size: 32, fill: COL.chalk, anchor: 'middle', weight: 600 });
  }],

  ['cp', 'Commercial paper', (m) => {
    const p = panel(0), y = 330, xs = [260, 600, 940];
    text(p, 'Commercial paper: unsecured, usually under 3 months', 800, 130, m('a'), { size: 38, fill: COL.chalk, anchor: 'middle', weight: 600 });
    draw(path(p, 'M200 460H1360', { stroke: COL.chalk, 'stroke-width': 3 }, { d: 0 }), m('a'), .8);
    xs.forEach((x, i) => {
      const g = G(p, { o: 0, y: 20 }); mk('rect', { x, y: y - 40, width: 320, height: 80, rx: 10, fill: i % 2 ? COL.whole : COL.task, 'fill-opacity': .85 }, g);
      T(g, 'CP ' + (i + 1), { x: x + 160, y: y + 12, size: 34, fill: COL.board, weight: 700, anchor: 'middle' });
      tw(g, { o: 1, y: 0 }, i ? m('roll', .4 + (i - 1) * 1.2) : m('a', 1.2), .5, out);
    });
    [0, 1].forEach(i => { draw(path(p, `M${xs[i] + 160} ${y + 50}Q${xs[i] + 330} ${y + 170} ${xs[i + 1] + 160} ${y + 50}`, { stroke: COL.good, 'stroke-width': 4 }, { d: 0 }), m('roll', .1 + i * 1.2), .7); });
    text(p, 'repaid with the proceeds of new paper', 600, 520, m('roll', .2), { size: 28, fill: COL.good, anchor: 'middle', weight: 600 });
    text(p, 'rollover risk: what if no one buys the new paper?', 800, 575, m('roll', 2.6), { size: 30, fill: COL.bad, anchor: 'middle', weight: 700 });
    show(pill(p, 'committed backup line from banks repays the paper if a rollover fails', COL.good, 800, 680, 0, 28), m('back'));
    show(pill(p, 'issuers: financial institutions ≈ 60% · governments · supranationals', COL.whole, 800, 780, 0, 26), m('who'));
  }],

  ['banks', 'Bank funding sources', (m) => {
    const p = panel(0), bx = 800, by = 450;
    const bank = party(p, bx, by, 300, 130, COL.task, 'Bank', null); show(bank, .3);
    [[330, 250, COL.good, 'Demand & savings deposits', 'dep', 'M560 250L700 410'], [330, 400, COL.whole, 'Certificates of deposit (CDs)', 'cd', 'M560 400L650 440'],
     [1270, 250, COL.rat, 'Interbank market', 'ib', 'M1040 250L900 410'], [1270, 400, COL.bad, 'Central bank funds market', 'cb', 'M1030 400L950 440'],
     [800, 700, COL.chalk, 'Commercial paper & ABCP', 'cpp', 'M800 660V520']].forEach(([x, y, c, s, k, d]) => {
      show(pill(p, s, c, x, y, 0, 28), m(k)); draw(path(p, d, { stroke: c, 'stroke-width': 3 }, { d: 0 }), m(k, .3), .6);
    });
    text(p, 'overnight to one year', 1270, 320, m('ib', 1.5), { size: 24, fill: COL.dim, anchor: 'middle' });
    show(pill(p, 'last resort: central bank loan, higher rate', COL.bad, 1270, 560, 0, 24), m('cb', 4));
    text(p, 'stable in normal times; CDs can be sold', 330, 320, m('cd', .3), { size: 24, fill: COL.dim, anchor: 'middle' });
  }],

  ['abcp', 'Asset-backed commercial paper', (m) => {
    const p = panel(0), y = 400;
    show(party(p, 260, y, 300, 130, COL.task, 'Bank', null), m('s1')); show(party(p, 800, y, 300, 130, COL.rat, 'SPE', 'special purpose entity'), m('s1', .4)); show(party(p, 1340, y, 300, 130, COL.good, 'Investors', null), m('s2'));
    arw(p, 420, y - 25, 640, COL.whole, m('s1', 1)); lab(p, 'short-term loans', 530, y - 50, m('s1', 1.3), COL.whole, 24);
    arw(p, 640, y + 30, 420, COL.good, m('s1', 2)); lab(p, 'cash', 530, y + 75, m('s1', 2.3), COL.good, 24);
    arw(p, 960, y - 25, 1180, COL.whole, m('s2', .5)); lab(p, 'ABCP', 1070, y - 50, m('s2', .8), COL.whole, 24);
    arw(p, 1180, y + 30, 960, COL.good, m('s2', 1.3)); lab(p, 'cash', 1070, y + 75, m('s2', 1.6), COL.good, 24);
    draw(path(p, 'M260 335Q530 170 800 335', { stroke: COL.dim, 'stroke-width': 4, 'stroke-dasharray': '10 8' }, { d: 0 }), m('s2', 3), 1);
    lab(p, 'backup liquidity line from the bank', 530, 235, m('s2', 3.6), COL.dim, 26);
    show(pill(p, 'off the bank\'s balance sheet', COL.rat, 800, 590, 0, 30), m('off'));
    text(p, 'financial crisis: paper could not be rolled, many SPEs failed', 800, 700, m('crisis'), { size: 30, fill: COL.bad, anchor: 'middle', weight: 600 });
    text(p, 'today: mostly short-term, high-quality loans and receivables', 800, 760, m('crisis', 4.5), { size: 30, fill: COL.good, anchor: 'middle', weight: 600 });
  }],

  ['repo', 'Repurchase agreements', (m) => {
    const p = panel(0);
    text(p, 'Repo: sell now, buy back later at a higher price', 800, 100, m('sell'), { size: 40, fill: COL.chalk, anchor: 'middle', weight: 600 });
    show(party(p, 220, 400, 300, 360, COL.task, 'Security seller', 'cash borrower'), m('sell', .6)); show(party(p, 1380, 400, 300, 360, COL.good, 'Security buyer', 'cash lender'), m('sell', .9));
    lab(p, '$100 million Treasury note', 800, 180, m('ex'), COL.chalk, 30);
    text(p, 'Today (t = 0)', 800, 235, m('leg1', -.3), { size: 28, fill: COL.dim, anchor: 'middle' });
    arw(p, 400, 290, 1200, COL.task, m('leg1')); lab(p, 'Treasury note', 800, 270, m('leg1', .3), COL.task, 26);
    arw(p, 1200, 360, 400, COL.good, m('leg1', .8)); lab(p, '$100,000,000 cash', 800, 400, m('leg1', 1.1), COL.good, 26);
    text(p, '30 days later (t = T)', 800, 480, m('leg2', -.3), { size: 28, fill: COL.dim, anchor: 'middle' });
    arw(p, 1200, 535, 400, COL.task, m('leg2')); lab(p, 'same note back', 800, 515, m('leg2', .3), COL.task, 26);
    arw(p, 400, 605, 1200, COL.good, m('leg2', .8)); lab(p, '$100,020,833', 800, 645, m('leg2', 1.1), COL.good, 26);
    text(p, 'interest = $100m × 0.25% × 30/360 = $20,833', 800, 750, m('calc'), { size: 36, fill: COL.good, anchor: 'middle', weight: 600 });
    show(pill(p, 'the buyer\'s side is also called a reverse repo', COL.rat, 800, 830, 0, 28), m('roles'));
  }],

  ['margin', 'Margin and haircut', (m) => {
    const p = panel(0), base = 760, sc = 50, H = v => (v - 95) * sc;
    axes2(p, 200, base, 820, 200, null, null);
    text(p, 'scale starts at $95 million', 200, 860, m('im'), { size: 24, fill: COL.faint });
    const col = G(p, { x: 360, o: 0 }), loan = G(p, { x: 660, o: 0 });
    const cb = mk('rect', { x: -80, y: base - H(100), width: 160, height: H(100), fill: COL.task, 'fill-opacity': .88, rx: 5 }, col);
    mk('rect', { x: -80, y: base - H(98.04), width: 160, height: H(98.04), fill: COL.good, 'fill-opacity': .9, rx: 5 }, loan);
    T(col, 'collateral', { y: 40 + base, size: 28, fill: COL.task, weight: 600, anchor: 'middle' }); T(loan, 'loan', { y: 40 + base, size: 28, fill: COL.good, weight: 600, anchor: 'middle' });
    const lb1 = T(col, '$100.0m', { y: base - H(100) - 14, size: 28, fill: COL.chalk, weight: 700, anchor: 'middle' });
    T(loan, '$98.04m', { y: base - H(98.04) - 14, size: 28, fill: COL.chalk, weight: 700, anchor: 'middle' });
    show(col, m('im')); show(loan, m('loan'));
    text(p, 'initial margin 102%: collateral = 1.02 × loan', 880, 280, m('im', .5), { size: 28, fill: COL.task, weight: 600 });
    text(p, 'loan = 100 ÷ 1.02 = $98.04m', 880, 340, m('loan'), { size: 30, fill: COL.good, weight: 600 });
    text(p, 'haircut = 1.96%', 880, 400, m('loan', 1.5), { size: 30, fill: COL.bad, weight: 700 });
    text(p, 'axis exaggerates the gap', 880, 440, m('loan', 1.5), { size: 22, fill: COL.faint });
    prog(q => { const v = 100 + 3 * q; cb.setAttribute('y', base - H(v)); cb.setAttribute('height', H(v)); put(lb1, { y: base - H(v) - 14 }); lb1.textContent = '$' + v.toFixed(1) + 'm'; }, m('var'), 1.6);
    text(p, 'notes rise to $103m: over-collateralized', 880, 520, m('var'), { size: 30, fill: COL.task, weight: 600 });
    text(p, 'excess ≈ $3.0m  →  release ≈ $2.91m of notes', 880, 580, m('rel'), { size: 30, fill: COL.good, weight: 700 });
    text(p, 'price falls → lender asks for more collateral', 880, 640, m('rel', 3), { size: 30, fill: COL.bad, weight: 600 });
    text(p, 'variation margin', 880, 700, m('rel', 4), { size: 30, fill: COL.rat, weight: 700 });
  }],

  ['uses', 'Uses of repos', (m) => {
    const p = panel(0);
    show(infoCard(p, 290, 330, 440, 300, COL.good, 'Lend cash', ['earn short-term income', 'secured, low liquidity and', 'default risk'], 40), m('inc'));
    show(infoCard(p, 800, 330, 440, 300, COL.task, 'Finance inventory', ['dealers borrow most of a', 'bond\'s price against', 'the bond itself'], 40), m('fin'));
    show(infoCard(p, 1310, 330, 440, 300, COL.whole, 'Central banks', ['add or drain cash in the', 'banking system for', 'short-term policy'], 40), m('cbk'));
    show(pill(p, 'and: sell short by borrowing a security in a repo', COL.rat, 800, 640, 0, 32), m('short'));
  }],

  ['short', 'Short sale with a repo', (m) => {
    const p = panel(0), xs = [240, 610, 980, 1350];
    [['1  Repo', 'lend $100,000,000 cash', 'receive the Treasury note', COL.good, 's1'], ['2  Sell', 'sell the note in the market', 'receive $100,000,000', COL.task, 's2'], ['3  Buy back', '30 days later, buy the note', 'for $99,000,000', COL.whole, 's3'], ['4  Deliver', 'deliver the note, receive', '$100,020,833', COL.rat, 's4']].forEach(([t, a, b, c, k], i) => {
      const g = card1(p, xs[i], 330, 330, 240, c); T(g, t, { y: -60, size: 38, fill: c, weight: 700, anchor: 'middle' }); T(g, a, { y: 5, size: 25, fill: COL.chalk, weight: 600, anchor: 'middle' }); T(g, b, { y: 50, size: 25, fill: COL.dim, anchor: 'middle' });
      show(g, m(k));
      if (i < 3) draw(path(p, `M${xs[i] + 175} 330H${xs[i + 1] - 175}`, { stroke: COL.dim, 'stroke-width': 3 }, { d: 0 }), m(k, 1), .5);
    });
    text(p, 'profit = 100,020,833 − 99,000,000 = $1,020,833', 800, 600, m('pl'), { size: 44, fill: COL.good, anchor: 'middle', weight: 700 });
    text(p, 'before costs · the note\'s price fell, so the short pays off', 800, 680, m('pl', 1.8), { size: 30, fill: COL.dim, anchor: 'middle' });
  }],

  ['rates', 'What drives repo rates', (m) => {
    const p = panel(0);
    [[430, 300, COL.whole, 'Money market rates', ['repo rates follow short-term rates', 'central banks steer them'], 'mm'], [1170, 300, COL.bad, 'Collateral quality', ['riskier collateral → higher rate', 'equities, emerging market bonds'], 'col'],
     [430, 580, COL.task, 'Repo term', ['longer term → usually a higher rate', 'when long rates exceed short rates'], 'term'], [1170, 580, COL.rat, 'Collateral uniqueness', ['high demand for one bond → lower rate', 'special rate can fall below zero'], 'uniq']]
      .forEach(([x, y, c, t, l, k]) => show(infoCard(p, x, y, 640, 220, c, t, l, 38), m(k)));
  }],

  ['wrap', 'Summary', (m) => {
    const p = panel(0);
    [['Bank funding ranges from uncommitted lines to revolvers.', 'w1'], ['Commercial paper is cheap, but needs a backup line.', 'w2'],
     ['A repo is a collateralized loan: sell now, buy back later.', 'w3'], ['Margin protects lenders; rates depend on collateral and demand.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 250 + i * 130, o: 0 });
      mk('circle', { cx: 150, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 150, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      T(g, str, { x: 210, size: 34, weight: 600 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],
  ['end', 'Complete', () => { panel(0); }, { ask: endCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
</body>
</html>
