<title>Asset-Backed Security (ABS) Instrument and Market Features</title>

<script src="../lib/engine.js"></script>
<script src="../lib/helpers.js"></script>
<script src="audio/en/timings.js"></script>
<script>
'use strict';
const CHAPTER = { number: 18, title: 'Asset-Backed Security (ABS) Instrument and Market Features', minutes: 10, language: 'en' };

const party = (p, x, y, w, h, color, title, sub) => { const g = card1(p, x, y, w, h, color); T(g, title, { y: sub ? -8 : 12, size: 34, fill: color, weight: 600, anchor: 'middle' }); if (sub) T(g, sub, { y: 32, size: 23, fill: COL.dim, anchor: 'middle' }); return g; };

const BEATS = [
  ['intro', 'ABS features', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Fixed Income, Module 18', { x: 800, y: 270, size: 28, fill: COL.dim, anchor: 'middle' });
    ['Asset-Backed Security (ABS)', 'Instrument and', 'Market Features'].forEach((s, i) => T(g, s, { x: 800, y: 370 + i * 92, size: 72, weight: 600, anchor: 'middle' }));
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = text(scene, 'covered bonds, credit enhancement and non-mortgage ABS', 800, 700, m('sub'), { size: 34, fill: COL.dim, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],

  ['covered', 'Covered bonds', (m) => {
    const p = panel(0);
    const bank = card1(p, 480, 400, 700, 520, COL.task); T(bank, 'Issuing bank', { y: -215, size: 36, fill: COL.task, weight: 700, anchor: 'middle' }); show(bank, m('a', -.3));
    const cp = card1(p, 480, 340, 560, 190, COL.good); T(cp, 'Cover pool (ringfenced loans)', { y: -30, size: 30, fill: COL.good, weight: 700, anchor: 'middle' }); T(cp, 'monitored · replaced if loans prepay or fail', { y: 20, size: 24, fill: COL.dim, anchor: 'middle' }); T(cp, 'overcollateralized · LTV standards', { y: 60, size: 24, fill: COL.dim, anchor: 'middle' }); show(cp, m('a'));
    const oa = card1(p, 480, 560, 560, 120, COL.whole); T(oa, 'Other (unencumbered) assets', { y: 10, size: 30, fill: COL.whole, weight: 600, anchor: 'middle' }); show(oa, m('dual', 1.5));
    const inv = party(p, 1250, 450, 320, 150, COL.rat, 'Covered bond', 'investors'); show(inv, m('a', .8));
    arw(p, 1090, 340, 830, COL.good, m('dual', .2)); text(p, '1  first recourse', 1250, 300, m('dual', .2), { size: 28, fill: COL.good, anchor: 'middle', weight: 700 });
    arw(p, 1090, 560, 830, COL.whole, m('dual', 1.5)); text(p, '2  second recourse', 1250, 620, m('dual', 1.5), { size: 28, fill: COL.whole, anchor: 'middle', weight: 700 });
    text(p, 'Germany: overcollateralized by at least 2%', 1250, 760, m('oc'), { size: 26, fill: COL.task, anchor: 'middle', weight: 600 });
    show(pill(p, 'lower credit risk and lower yield than similar ABS', COL.rat, 800, 85, 0, 32), m('low'));
  }],

  ['redeem', 'Redemption regimes', (m) => {
    const p = panel(0);
    show(infoCard(p, 290, 270, 440, 340, COL.bad, 'Hard bullet', ['payment missed →', 'bond defaults', 'payments accelerate'], 40), m('hard'));
    show(infoCard(p, 800, 270, 440, 340, COL.task, 'Soft bullet', ['default delayed to a new', 'final maturity', 'usually up to a year later'], 40), m('soft'));
    show(infoCard(p, 1310, 270, 440, 340, COL.good, 'Conditional pass-through', ['converts to a pass-through', 'security after original', 'maturity if unpaid'], 31), m('cpt'));
    show(infoCard(p, 420, 650, 640, 220, COL.rat, 'Covered bonds', ['funding tool for banks', 'fixed rate, fixed maturity'], 36), m('vs'));
    show(infoCard(p, 1180, 650, 640, 220, COL.whole, 'ABS', ['assets leave the balance sheet', 'payments (and prepayments) pass through'], 36), m('vs', 2));
  }],

  ['enh', 'Credit enhancement', (m) => {
    const p = panel(0);
    show(infoCard(p, 290, 370, 440, 420, COL.good, 'Overcollateralization', ['collateral €1,200m', 'bonds €1,000m', '10% of collateral defaults', '€1,080m is still left'], 34), m('oc'));
    show(infoCard(p, 800, 370, 440, 420, COL.whole, 'Excess spread', ['pool earns 8%', 'bonds pay 6%', 'extra 2% absorbs shortfalls', 'or builds reserves'], 40), m('xs'));
    show(infoCard(p, 1310, 370, 440, 420, COL.bad, 'Subordination', ['junior tranches absorb', 'losses first', 'senior tranches are', 'protected'], 40), m('sub'));
    show(pill(p, 'external: bank or insurer guarantees · letters of credit · cash collateral accounts', COL.rat, 800, 740, 0, 28), m('ext'));
    text(p, 'internal credit enhancements', 800, 100, .3, { size: 36, fill: COL.chalk, anchor: 'middle', weight: 600 });
  }],

  ['waterfall', 'A four-tranche structure', (m) => {
    const p = panel(0), base = 780, k = .52, x = 300, w = 340;
    const segs = [['Class A (senior)', 825, COL.good, 0], ['Class B', 100, COL.whole, 825], ['Class C', 50, COL.task, 925], ['Class D (junior)', 25, COL.bad, 975]];
    segs.forEach(([n, v, c, off], i) => {
      const g = G(p, { y: 20, o: 0 }); mk('rect', { x, y: base - (off + v) * k, width: w, height: Math.max(v * k, 22), fill: c, 'fill-opacity': .88 }, g);
      const ly = [null, 345, 295, 245][i], cy = base - (off + v / 2) * k;
      if (ly) { T(g, n + ' €' + v + 'm', { x: x + w + 40, y: ly + 8, size: 28, fill: c, weight: 700 }); path(g, `M${x + w} ${cy}L${x + w + 30} ${ly}`, { stroke: c, 'stroke-width': 3 }); }
      else T(g, 'Class A  €' + v + 'm', { x: x + w / 2, y: cy + 10, size: 34, fill: COL.board, weight: 700, anchor: 'middle' });
      tw(g, { o: 1, y: 0 }, m('tr', .3 + i * 1.8), .6, out);
    });
    text(p, '€1,000m car loan pool', x + w / 2, base + 50, m('tr'), { size: 28, fill: COL.dim, anchor: 'middle' });
    const lossH = 70 * k, loss = mk('rect', { x: x - 8, y: base - 1000 * k, width: w + 16, height: 0, fill: COL.chalk, 'fill-opacity': .45, stroke: COL.chalk, 'stroke-width': 3, 'stroke-dasharray': '10 6' }, p); tw(loss, { a_height: lossH }, m('ex'), 1.8);
    text(p, 'losses €70m', x - 24, base - 1000 * k + 40, m('ex'), { size: 28, fill: COL.chalk, anchor: 'end', weight: 700 });
    const lines = [['order of losses: D → C → B → A', COL.dim, 'ord', 450, 30], ['Class D: first €25m — wiped out', COL.bad, 'ex', 520, 32], ['Class C: absorbs €45m — gets back €5m', COL.task, 'ex', 580, 32, 3], ['Classes A and B: paid in full', COL.good, 'ab', 640, 32], ['A loses only if losses exceed €175m', COL.good, 'thr', 700, 30], ['lower = higher risk and higher spread', COL.rat, 'ret', 770, 30]];
    lines.forEach(([s, c, k_, y, sz, o]) => text(p, s, 900, y, m(k_, o || 0), { size: sz, fill: c, weight: 600 }));
  }],

  ['amort', 'Amortizing and non-amortizing ABS', (m) => {
    const p = panel(0), y = 420, x = t => 240 + t * 130;
    draw(path(p, `M${x(0)} ${y}H${x(9)}`, { stroke: COL.chalk, 'stroke-width': 3 }, { d: 0 }), .3, .8);
    for (let t = 0; t <= 9; t++) { path(p, `M${x(t)} ${y - 8}V${y + 8}`, { stroke: COL.chalk, 'stroke-width': 3 }); text(p, String(t), x(t), y + 44, .5, { size: 22, fill: COL.dim, anchor: 'middle' }); }
    text(p, 'years', x(9) + 60, y + 44, .5, { size: 22, fill: COL.dim });
    const seg = (a, b, c, s, k, o) => { const g = G(p, { o: 0 }); mk('rect', { x: x(a), y: y - 130, width: x(b) - x(a), height: 90, rx: 8, fill: c, 'fill-opacity': .85 }, g); T(g, s, { x: (x(a) + x(b)) / 2, y: y - 76, size: 32, fill: COL.board, weight: 700, anchor: 'middle' }); show(g, m(k, o)); };
    seg(0, 3, COL.whole, 'revolving (lockout)', 'rev', 0); seg(3, 9, COL.good, 'amortization', 'am', 0);
    text(p, 'investors get only finance charges and fees;', (x(0) + x(3)) / 2, y + 100, m('rev', 1), { size: 24, fill: COL.whole, anchor: 'middle' }); text(p, 'repaid principal buys new receivables', (x(0) + x(3)) / 2, y + 134, m('rev', 1.3), { size: 24, fill: COL.whole, anchor: 'middle' });
    text(p, 'principal is passed through to investors', (x(3) + x(9)) / 2, y + 100, m('am', 1), { size: 26, fill: COL.good, anchor: 'middle' });
    text(p, 'credit card ABS: 3 revolving years + 6 amortization years', 800, 150, m('ex'), { size: 34, fill: COL.chalk, anchor: 'middle', weight: 600 });
    draw(path(p, `M${x(2)} ${y - 170}L${x(2)} ${y - 40}`, { stroke: COL.bad, 'stroke-width': 4, 'stroke-dasharray': '8 6' }, { d: 0 }), m('early'), .6); text(p, 'poor pool performance → rapid amortization', x(2) + 14, y - 180, m('early', .3), { size: 26, fill: COL.bad, weight: 700 });
    show(infoCard(p, 420, 700, 640, 200, COL.task, 'Credit card ABS', ['non-amortizing collateral', 'no prepayment risk while revolving'], 36), m('rev', 3));
    show(infoCard(p, 1180, 700, 640, 200, COL.rat, 'Auto loan ABS', ['amortizing loans', 'prepayment and default risk'], 36), m('auto'));
  }],

  ['solar', 'Solar ABS', (m) => {
    const p = panel(0), base = 640, k = 1.5;
    path(p, `M240 ${base}H940`, { stroke: COL.chalk, 'stroke-width': 3 });
    [['Loan pool', 320, 440, COL.whole, 'pool'], ['Notes issued', 300, 760, COL.good, 'pool']].forEach(([n, v, x, c, mk_], i) => {
      const g = G(p, { y: 20, o: 0 }); mk('rect', { x: x - 90, y: base - v, width: 180, height: v, fill: c, 'fill-opacity': .88, rx: 5 }, g); T(g, '€' + v + 'm', { x, y: base - v - 16, size: 34, fill: COL.chalk, weight: 700, anchor: 'middle' }); T(g, n, { x, y: base + 46, size: 28, fill: c, weight: 600, anchor: 'middle' }); tw(g, { o: 1, y: 0 }, m(mk_, .3 + i * 1.2), .6, out);
    });
    text(p, 'overcollateralization: €20m (≈ 6.7%)', 590, 235, m('pool', 3), { size: 26, fill: COL.task, anchor: 'middle', weight: 600 });
    text(p, '10,000 solar home-improvement loans', 590, 140, m('pool'), { size: 34, fill: COL.chalk, anchor: 'middle', weight: 600 });
    show(infoCard(p, 1250, 280, 520, 210, COL.whole, 'The loans', ['average €32,500 · 7.5%', 'amortizing over 17 years'], 38), m('loan'));
    show(infoCard(p, 1250, 520, 520, 210, COL.good, 'Protection', ['overcollateralization · subordination', 'reserve accounts · excess spread'], 38), m('ce'));
    show(pill(p, 'proceeds fund solar systems: may qualify as green bonds', COL.rat, 800, 770, 0, 28), m('green'));
    text(p, 'first public solar ABS: collateral ≈ 2.7 × the bonds', 800, 850, m('sc'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 600 });
  }],

  ['cdo', 'CDOs and CLOs', (m) => {
    const p = panel(0);
    show(party(p, 280, 380, 400, 220, COL.dim, 'Collateral pool', 'non-mortgage debt: loans, bonds'), m('pool'));
    show(party(p, 790, 380, 340, 130, COL.rat, 'CLO', 'collateralized loan obligation'), m('pool', 1.5)); arw(p, 490, 380, 600, COL.dim, m('pool', 1)); arw(p, 970, 380, 1070, COL.dim, m('tr', .2));
    [['Senior', 'bond-like payments · lowest risk', COL.good, 0], ['Mezzanine', 'higher yield', COL.whole, 1], ['Equity', 'residual · highest, variable return', COL.bad, 2]].forEach(([n, s, c, i]) => {
      const g = card1(p, 1330, 230 + i * 150, 440, 120, c); T(g, n, { x: -200, y: -6, size: 34, fill: c, weight: 700 }); T(g, s, { x: -200, y: 34, size: 24, fill: COL.dim }); show(g, m('tr', .6 + i * .6));
    });
    show(pill(p, 'replicates a firm\'s capital structure: senior debt · mezzanine · equity', COL.task, 800, 650, 0, 30), m('cap'));
    show(pill(p, 'collateral manager actively buys and sells loans', COL.good, 800, 730, 0, 28), m('mgr'));
    show(pill(p, 'complex, non-linear risk when defaults cluster', COL.bad, 800, 810, 0, 28), m('risk'));
  }],

  ['wrap', 'Summary', (m) => {
    const p = panel(0);
    [['Covered bonds: dual recourse; assets stay on the balance sheet.', 'w1'], ['Enhancement: overcollateralization, excess spread, subordination.', 'w2'],
     ['Non-amortizing ABS revolve, then amortize; early triggers.', 'w3'], ['CDOs and CLOs tranche loans like a capital structure.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 250 + i * 130, o: 0 });
      mk('circle', { cx: 150, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 150, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      T(g, str, { x: 210, size: 33, weight: 600 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],
  ['end', 'Complete', () => { panel(0); }, { ask: endCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
</body>
</html>
