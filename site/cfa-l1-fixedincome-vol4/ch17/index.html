<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixed-Income Securitization</title>
<link rel="stylesheet" href="../lib/engine.css">
<link rel="expect" href="#bar" blocking="render"><!-- hold the first frame until the player exists, so the page transition can run -->
</head>
<body>
<script src="../lib/engine.js"></script>
<script src="../lib/helpers.js"></script>
<script src="audio/en/timings.js"></script>
<script>
'use strict';
const CHAPTER = { number: 17, title: 'Fixed-Income Securitization', minutes: 8, language: 'en', next: '../ch18/' };

const party = (p, x, y, w, h, color, title, sub) => { const g = card1(p, x, y, w, h, color); T(g, title, { y: sub ? -8 : 12, size: 34, fill: color, weight: 600, anchor: 'middle' }); if (sub) T(g, sub, { y: 32, size: 23, fill: COL.dim, anchor: 'middle' }); return g; };
const lab = (p, s, x, y, t, c = COL.chalk, size = 24) => text(p, s, x, y, t, { size, fill: c, anchor: 'middle', weight: 600 });

const BEATS = [
  ['intro', 'Securitization', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Fixed Income, Module 17', { x: 800, y: 300, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Fixed-Income', { x: 800, y: 410, size: 90, weight: 600, anchor: 'middle' });
    T(g, 'Securitization', { x: 800, y: 515, size: 90, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = text(scene, 'turning pools of loans into securities', 800, 640, m('sub'), { size: 34, fill: COL.dim, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],

  ['process', 'The securitization process', (m) => {
    const p = panel(0), y = 330;
    show(party(p, 260, y, 340, 150, COL.task, 'Originator', 'seller of the loans'), m('orig')); show(party(p, 800, y, 340, 150, COL.rat, 'SPE', 'special purpose entity'), m('orig', .6)); show(party(p, 1340, y, 340, 150, COL.good, 'Investors', 'hold the securities'), m('spe'));
    arw(p, 440, y - 30, 620, COL.whole, m('orig', 1)); lab(p, 'loans', 530, y - 55, m('orig', 1.3), COL.whole); arw(p, 620, y + 35, 440, COL.good, m('orig', 2)); lab(p, 'cash', 530, y + 80, m('orig', 2.3), COL.good);
    arw(p, 980, y - 30, 1160, COL.whole, m('spe', .6)); lab(p, 'ABS', 1070, y - 55, m('spe', .9), COL.whole); arw(p, 1160, y + 35, 980, COL.good, m('spe', 1.4)); lab(p, 'cash', 1070, y + 80, m('spe', 1.7), COL.good);
    const bw = party(p, 800, 590, 400, 100, COL.dim, 'Borrowers', null); show(bw, m('pay'));
    draw(path(p, 'M800 540V420', { stroke: COL.good, 'stroke-width': 5 }, { d: 0 }), m('pay', .6), .8); text(p, 'interest + principal → investors', 1040, 505, m('pay', 1.4), { size: 28, fill: COL.good, weight: 600 });
    show(party(p, 440, 760, 480, 110, COL.whole, 'Servicer', 'collects payments, chases delinquents'), m('serv'));
    show(pill(p, 'accountants · lawyers · rating agencies · underwriters', COL.dim, 1180, 760, 0, 24), m('serv', 2.5));
    show(pill(p, 'separate legal entity: assets shielded from the originator\'s creditors', COL.rat, 800, 130, 0, 30), m('legal'));
  }],

  ['types', 'Types of securitized products', (m) => {
    const p = panel(0);
    text(p, 'increasing complexity  →', 800, 130, .3, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    show(infoCard(p, 290, 400, 440, 440, COL.good, 'Covered bond', ['pool stays on the bank\'s', 'balance sheet', 'bank pays investors,', 'pool is the backup', 'not a full securitization'], 38), m('cov'));
    show(infoCard(p, 800, 400, 440, 440, COL.whole, 'Pass-through', ['true securitization:', 'pool moves to an SPE', 'payments pass through', 'proportionally', 'to investors'], 38), m('pass'));
    show(infoCard(p, 1310, 400, 440, 440, COL.rat, 'Structured (tranched)', ['preset schedule', 'redistributes cash flows', 'more predictable payments', 'redistributes risk', 'MBS: backed by mortgages'], 34), m('struct'));
    show(pill(p, 'MBS = ABS backed by a pool of mortgages', COL.task, 800, 780, 0, 30), m('mbs'));
  }],

  ['tranche', 'Tranching and subordination', (m) => {
    const p = panel(0), base = 740, k = 4.6, x = 420, w = 300;
    const segs = [['Senior', 70, COL.good, 0], ['Mezzanine', 20, COL.whole, 70], ['Junior', 10, COL.bad, 90]];
    segs.forEach(([n, v, c, off], i) => {
      const g = G(p, { y: 20, o: 0 }); mk('rect', { x, y: base - (off + v) * k, width: w, height: v * k, fill: c, 'fill-opacity': .88 }, g); T(g, n + ' ' + v, { x: x + w / 2, y: base - (off + v / 2) * k + 10, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      tw(g, { o: 1, y: 0 }, m('pool', .3 + i * .5), .6, out);
    });
    text(p, 'one pool: 100', x + w / 2, base + 60, m('pool'), { size: 30, fill: COL.dim, anchor: 'middle', weight: 600 });
    draw(path(p, `M${x + w + 70} ${base - 380}V${base - 20}`, { stroke: COL.chalk, 'stroke-width': 4 }, { d: 0 }), m('order'), 1); draw(path(p, `M${x + w + 45} ${base - 50}L${x + w + 70} ${base - 15}L${x + w + 95} ${base - 50}`, { stroke: COL.chalk, 'stroke-width': 4 }, { d: 0 }), m('order', .8), .3);
    text(p, 'losses absorbed first', x + w + 110, base - 360, m('order'), { size: 28, fill: COL.bad, weight: 700 }); text(p, 'paid first', x + w + 110, base - 20, m('order', 1.6), { size: 28, fill: COL.good, weight: 700 });
    const loss = mk('rect', { x: x - 6, y: base - 100 * k, width: w + 12, height: 0, fill: COL.chalk, 'fill-opacity': .5, stroke: COL.chalk, 'stroke-width': 3, 'stroke-dasharray': '10 6' }, p); tw(loss, { a_height: 12 * k }, m('loss'), 1.6);
    text(p, 'defaults: −12', x - 30, base - 100 * k + 12 * k / 2 + 10, m('loss'), { size: 28, fill: COL.chalk, anchor: 'end', weight: 700 });
    [['junior 10: wiped out', COL.bad, 0], ['mezzanine: loses 2', COL.whole, 2.2], ['senior: untouched', COL.good, 4.2]].forEach(([s, c, o], i) => text(p, s, 1190, 400 + i * 80, m('loss', .6 + o), { size: 36, fill: c, weight: 700 }));
    show(pill(p, 'subordination = credit enhancement', COL.rat, 1280, 700, 0, 32), m('ce'));
  }],

  ['benefits', 'Benefits of securitization', (m) => {
    const p = panel(0);
    show(infoCard(p, 290, 330, 440, 400, COL.task, 'Issuers', ['assets off the balance sheet', 'lower leverage', 'fee income, more lending', 'funding can cost less:', 'investors rely on the pool'], 40), m('iss'));
    show(infoCard(p, 800, 330, 440, 400, COL.good, 'Investors', ['access to loans without', 'originating them', 'choose risk, return, maturity', 'pension fund: match long', 'liabilities with long debt'], 40), m('inv'));
    show(infoCard(p, 1310, 330, 440, 400, COL.whole, 'Economies and markets', ['more liquidity', 'efficient capital allocation', 'risk spread to those', 'best able to hold it'], 36), m('mkt'));
  }],

  ['wrap', 'Summary', (m) => {
    const p = panel(0);
    [['Securitization pools loans and sells securities backed by them.', 'w1'], ['A special purpose entity separates assets from the originator.', 'w2'],
     ['Tranching: junior absorbs losses first; senior is paid first.', 'w3'], ['Benefits reach issuers, investors, and markets.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 250 + i * 130, o: 0 });
      mk('circle', { cx: 150, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 150, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      T(g, str, { x: 210, size: 33, weight: 600 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],
  ['end', 'Complete', () => { panel(0); }, { ask: endCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
</body>
</html>
